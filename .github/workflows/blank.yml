      <!-- PRIMARY SOURCE CODEX -->
      <section id="sources" class="source-section" aria-labelledby="sources-title">
        <div class="section-label">006 • Primary Source Codex</div>
        <h2 class="section-title" id="sources-title">
          Primary Sources for Revolution, Reaction &amp; Reform
        </h2>
        <p class="section-intro">
          This codex groups primary and archival sources that support my
          argument. In an actual project, each item would be cited in my
          annotated bibliography. I can continue adding sources until I reach
          the number required for my category, but this layout already shows
          how the sources support different parts of the theme.
        </p>

        <div class="source-columns">
          <!-- REVOLUTION SOURCES -->
          <div class="source-column">
            <h3>Revolution: Warnings &amp; Awakening</h3>
            <small>Scientific texts · early protests · visible crises</small>
            <ul class="source-list">
              <li>
                <strong>Rachel Carson, <em>Silent Spring</em> (1962)</strong><br />
                <span class="source-note">
                  Book that exposed the dangers of pesticides and tied them to
                  ecological damage and human health. Supports the “revolution
                  in ideas” part of my argument.
                </span>
              </li>
              <li>
                <strong>“The Obligation to Endure” – chapter from <em>Silent Spring</em></strong><br />
                <span class="source-note">
                  Key chapter summarizing why human beings must take
                  responsibility for chemical pollution, useful for pulling
                  short quotes.
                </span>
              </li>
              <li>
                <strong>Photographs and reports of the Cuyahoga River fire (1969)</strong><br />
                <span class="source-note">
                  News coverage and images of the burning river that showed
                  how extreme water pollution had become and helped spark
                  national outrage.
                </span>
              </li>
              <li>
                <strong>Original Earth Day posters and flyers (1970)</strong><br />
                <span class="source-note">
                  Visual sources that reveal what issues organizers highlighted
                  and how they framed the “environmental crisis” to the public.
                </span>
              </li>
              <li>
                <strong>Eyewitness accounts of smog in major U.S. cities</strong><br />
                <span class="source-note">
                  Interviews and oral histories from residents of heavily
                  polluted cities, showing daily life during the pre-reform era.
                </span>
              </li>
            </ul>
          </div>

          <!-- REACTION SOURCES -->
          <div class="source-column">
            <h3>Reaction: Backlash, Debate &amp; Media</h3>
            <small>Industry responses · political speeches · news</small>
            <ul class="source-list">
              <li>
                <strong>Editorials criticizing <em>Silent Spring</em></strong><br />
                <span class="source-note">
                  Opinion pieces and reviews that attacked Carson and defended
                  pesticide use, revealing industry and media backlash.
                </span>
              </li>
              <li>
                <strong>Statements from chemical companies and trade groups</strong><br />
                <span class="source-note">
                  Corporate press releases claiming that pesticides were safe
                  and that environmentalists were overreacting.
                </span>
              </li>
              <li>
                <strong>Presidential “Messages on Environmental Quality”</strong><br />
                <span class="source-note">
                  Speeches to Congress that both acknowledge environmental
                  problems and stress the need to protect economic growth.
                </span>
              </li>
              <li>
                <strong>Congressional hearing transcripts on pollution</strong><br />
                <span class="source-note">
                  Includes testimony by scientists, industry lobbyists, and
                  citizens, showing multiple sides of the argument.
                </span>
              </li>
              <li>
                <strong>Local newspaper coverage of protests and teach-ins</strong><br />
                <span class="source-note">
                  Articles about Earth Day events, river cleanups, and local
                  activism that put pressure on representatives.
                </span>
              </li>
            </ul>
          </div>

          <!-- REFORM SOURCES -->
          <div class="source-column">
            <h3>Reform: Laws, Agencies &amp; Implementation</h3>
            <small>Statutes · legal texts · agency records</small>
            <ul class="source-list">
              <li>
                <strong>Text of the Clean Air Act (1970)</strong><br />
                <span class="source-note">
                  Primary legal document defining national air quality standards
                  and EPA authority; I can quote key phrases about goals and
                  enforcement.
                </span>
              </li>
              <li>
                <strong>Text of the Clean Water Act (1972)</strong><br />
                <span class="source-note">
                  Law establishing federal control over discharges to U.S.
                  waters; useful for showing how policy changed after river
                  disasters.
                </span>
              </li>
              <li>
                <strong>Text of the Endangered Species Act (1973)</strong><br />
                <span class="source-note">
                  Statute that protects threatened species and habitats,
                  demonstrating how reform extended beyond pollution to
                  biodiversity.
                </span>
              </li>
              <li>
                <strong>EPA founding documents and organizational charts</strong><br />
                <span class="source-note">
                  Show how responsibilities were reorganized under the new
                  agency and how the federal role expanded.
                </span>
              </li>
              <li>
                <strong>Early EPA enforcement case files or press releases</strong><br />
                <span class="source-note">
                  Evidence of how the new laws were actually applied to real
                  companies and cities.
                </span>
              </li>
            </ul>
          </div>

          <!-- IMPACT & DATA SOURCES -->
          <div class="source-column">
            <h3>Impact &amp; Long-Term Reflection</h3>
            <small>Data · before/after photos · modern analysis</small>
            <ul class="source-list">
              <li>
                <strong>EPA reports on trends in air pollution and health</strong><br />
                <span class="source-note">
                  Charts and statistics that show declines in major pollutants
                  and estimated health benefits.
                </span>
              </li>
              <li>
                <strong>“Before and after” photographs from polluted sites</strong><br />
                <span class="source-note">
                  Images from the early 1970s compared with more recent
                  photographs to visualize changes in air and water quality.
                </span>
              </li>
              <li>
                <strong>Case studies of species recovery under the ESA</strong><br />
                <span class="source-note">
                  Government or scientific reports describing how specific
                  endangered species were brought back from the brink.
                </span>
              </li>
              <li>
                <strong>Modern articles reflecting on the Clean Air and Water Acts</strong><br />
                <span class="source-note">
                  Analyses written decades later that ask whether these laws
                  succeeded and what challenges remain.
                </span>
              </li>
              <li>
                <strong>Recent court cases involving EPA authority</strong><br />
                <span class="source-note">
                  Show how the meaning and reach of environmental reforms are
                  still being contested in the 21st century.
                </span>
              </li>
            </ul>
          </div>
        </div>

        <p class="section-intro" style="margin-top:1.5rem;">
          Together, these sources show the full chain:
          <strong>Revolution</strong> happens when scientific warnings and
          visible disasters change how people think; <strong>Reaction</strong>
          includes both backlash and new demands from the public; and
          <strong>Reform</strong> is the creation of laws and institutions that
          we still live under today. My National History Day project argues
          that this environmental turning point matters because it not only
          changed the past, but also created the tools and debates we still use
          to decide how to protect the planet in the future.
        </p>
      </section>
